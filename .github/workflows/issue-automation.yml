name: Issue Management Automation

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read
  pull-requests: write

jobs:
  issue-triage:
    name: Triage and label new issues
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    outputs:
      category: ${{ steps.categorize.outputs.category }}
      priority: ${{ steps.categorize.outputs.priority }}
    steps:
      - name: Ensure required labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'bug', color: 'd73a4a', description: "Something isn't working" },
              { name: 'enhancement', color: 'a2eeef', description: 'New feature or request' },
              { name: 'epic', color: '8957e5', description: 'Large feature requiring multiple sub-tasks' },
              { name: 'maintenance', color: 'fbca04', description: 'Maintenance and housekeeping tasks' },
              { name: 'priority-critical', color: 'b60205', description: 'Critical priority issue' },
              { name: 'priority-high', color: 'd93f0b', description: 'High priority issue' },
              { name: 'priority-medium', color: 'fbca04', description: 'Medium priority issue' },
              { name: 'priority-low', color: '0e8a16', description: 'Low priority issue' },
              { name: 'needs-triage', color: 'ededed', description: 'Needs to be reviewed by maintainers' },
              { name: 'needs-review', color: 'fef2c0', description: 'Awaiting review from maintainers' },
              { name: 'first-time-contributor', color: '7057ff', description: 'Issue created by first-time contributor' }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label
                });
                core.info(`Created label: ${label.name}`);
              } catch (err) {
                if (err.status === 422) {
                  core.info(`Label already exists: ${label.name}`);
                } else {
                  core.warning(`Failed to ensure label ${label.name}: ${err.message}`);
                }
              }
            }

      - name: Categorize and prioritize
        id: categorize
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const combined = `${title}\n${body}`;

            const labelsToAdd = ['needs-triage'];
            const categories = [];

            if (title.includes('bug')) { labelsToAdd.push('bug'); categories.push('bug'); }
            if (title.includes('epic')) { labelsToAdd.push('epic'); categories.push('epic'); }
            if (title.includes('maintenance')) { labelsToAdd.push('maintenance'); categories.push('maintenance'); }

            // Highest priority wins
            const priorityRules = [
              { name: 'priority-critical', keywords: ['critical', 'urgent', 'production', 'outage'] },
              { name: 'priority-high',     keywords: ['important', 'high', 'blocking'] },
              { name: 'priority-medium',   keywords: ['medium', 'normal'] },
              { name: 'priority-low',      keywords: ['low', 'nice-to-have', 'minor'] }
            ];

            let priority = 'priority-medium'; // default
            let matched = false;
            for (const rule of priorityRules) {
              if (rule.keywords.some(k => combined.includes(k))) {
                priority = rule.name;
                matched = true;
                break;
              }
            }
            if (!matched) {
              core.info('No priority keyword found; defaulting to priority-medium');
            }
            labelsToAdd.push(priority);

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labelsToAdd
              });
              core.info(`Added labels: ${labelsToAdd.join(', ')}`);
            } catch (err) {
              core.warning(`Failed to add labels: ${err.message}`);
            }

            core.setOutput('category', categories.join(',') || 'uncategorized');
            core.setOutput('priority', priority);

  task-breakdown:
    name: Break Epics into sub-issues
    needs: issue-triage
    if: |
      github.event.action == 'opened' &&
      contains(github.event.issue.title, 'Epic')
    runs-on: ubuntu-latest
    steps:
      - name: Create sub-issues and update parent
        uses: actions/github-script@v7
        with:
          script: |
            const parent = context.payload.issue;
            const tasks = [
              'Requirements Analysis',
              'Design and Architecture',
              'Implementation',
              'Testing and Documentation'
            ];
            const created = [];
            for (let i = 0; i < tasks.length; i++) {
              const taskName = tasks[i];
              const subTitle = `[SUBTASK] ${parent.title} - Task ${i + 1}: ${taskName}`;
              const subBody = [
                `Related to #${parent.number}`,
                '',
                `This is sub-task **${i + 1} of ${tasks.length}** for the parent epic _"${parent.title}"_.`,
                '',
                `### Scope`,
                `- ${taskName}`,
                '',
                '### Definition of Done',
                '- [ ] Acceptance criteria reviewed',
                '- [ ] Implementation complete',
                '- [ ] Tested and documented'
              ].join('\n');
              try {
                const resp = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: subTitle,
                  body: subBody,
                  labels: ['enhancement', 'needs-review']
                });
                created.push({ number: resp.data.number, name: taskName });
                core.info(`Created sub-issue #${resp.data.number}: ${subTitle}`);
              } catch (err) {
                core.warning(`Failed to create sub-issue for ${taskName}: ${err.message}`);
              }
            }

            if (created.length === 0) {
              core.warning('No sub-issues were created; skipping parent update.');
              return;
            }

            const checklistLines = ['', '## Epic Tasks', ''];
            for (let i = 0; i < created.length; i++) {
              checklistLines.push(`- [ ] #${created[i].number} - Task ${i + 1}: ${created[i].name}`);
            }
            const newBody = `${parent.body || ''}\n${checklistLines.join('\n')}\n`;

            try {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parent.number,
                body: newBody
              });
              core.info(`Updated parent issue #${parent.number} with Epic Tasks checklist.`);
            } catch (err) {
              core.warning(`Failed to update parent issue: ${err.message}`);
            }

  auto-response:
    name: Auto-respond and finalize triage
    needs: issue-triage
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Welcome, respond, milestone, status
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').toLowerCase();
            const author = issue.user && issue.user.login ? issue.user.login : 'there';

            // 1) Check if this is the author's first issue in this repo
            let isFirstInRepo = false;
            try {
              const list = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                creator: author,
                per_page: 100
              });
              const realIssues = list.data.filter(i => !i.pull_request);
              isFirstInRepo = realIssues.length <= 1;
              core.info(`Author ${author} has ${realIssues.length} issue(s) in this repo; isFirst=${isFirstInRepo}`);
            } catch (err) {
              core.warning(`Could not determine first-issue status: ${err.message}`);
            }

            if (isFirstInRepo) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['first-time-contributor']
                });
              } catch (err) {
                core.warning(`Failed to add first-time-contributor label: ${err.message}`);
              }
              const welcome = [
                `👋 Welcome @${author}!`,
                '',
                'Thank you for opening your **first issue** in this repository.',
                'A maintainer will review it shortly. While you wait, please make sure your',
                'report includes enough context (steps, environment, expected vs. actual).',
                '',
                'We appreciate your contribution! 🎉'
              ].join('\n');
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: welcome
                });
              } catch (err) {
                core.warning(`Failed to post welcome comment: ${err.message}`);
              }
            }

            // 2) Type-specific response based on title keywords
            let typedBody = '';
            if (title.includes('bug')) {
              typedBody = [
                '## Bug Report Guidelines',
                '',
                'Thanks for reporting this bug! To help us resolve it quickly, please',
                'ensure your report includes:',
                '',
                '- A clear and concise description of the bug',
                '- Reproduction steps (1, 2, 3, …)',
                '- Expected vs. actual behavior',
                '- Environment details (OS, Node version, browser, etc.)',
                '- Relevant logs, stack traces, or screenshots',
                '',
                'A maintainer will triage this issue soon.'
              ].join('\n');
            } else if (title.includes('epic')) {
              typedBody = [
                '## Feature Request Process',
                '',
                'Thanks for the epic proposal! We follow this process for large features:',
                '',
                '1. **Requirements Analysis** — clarify scope and acceptance criteria',
                '2. **Design and Architecture** — agree on the technical approach',
                '3. **Implementation** — build the feature in reviewable chunks',
                '4. **Testing and Documentation** — verify and document',
                '',
                'We have automatically created sub-issues for each phase. Track progress',
                'via the "Epic Tasks" checklist above.'
              ].join('\n');
            } else if (title.includes('maintenance')) {
              typedBody = [
                '## Maintenance Guidelines',
                '',
                'Thanks for filing this maintenance task. Please make sure:',
                '',
                '- The scope is well-defined and bounded',
                '- No user-facing breaking changes (or they are clearly documented)',
                '- All tests continue to pass after changes',
                '- Dependencies and versions are pinned appropriately',
                '',
                'A maintainer will review this shortly.'
              ].join('\n');
            } else {
              typedBody = [
                'Thanks for opening this issue!',
                '',
                'A maintainer will review it shortly. If you can, please add additional',
                'context, reproduction steps, or supporting links to help us triage faster.'
              ].join('\n');
            }

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: typedBody
              });
            } catch (err) {
              core.warning(`Failed to post typed response: ${err.message}`);
            }

            // 3) Determine current priority labels (re-fetched, since triage just added them)
            let currentLabels = [];
            try {
              const cur = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number
              });
              currentLabels = (cur.data.labels || []).map(l => (typeof l === 'string' ? l : l.name));
            } catch (err) {
              core.warning(`Failed to re-fetch issue labels: ${err.message}`);
            }
            const isHighOrCritical =
              currentLabels.includes('priority-high') ||
              currentLabels.includes('priority-critical');

            if (isHighOrCritical) {
              let milestone = null;
              try {
                const ms = await github.rest.issues.listMilestones({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'all',
                  per_page: 100
                });
                milestone = ms.data.find(m => m.title === 'v1.0.0') || null;
              } catch (err) {
                core.warning(`Failed to list milestones: ${err.message}`);
              }
              if (!milestone) {
                try {
                  const createdMs = await github.rest.issues.createMilestone({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: 'v1.0.0',
                    description: 'Initial release milestone (auto-created by issue automation).'
                  });
                  milestone = createdMs.data;
                } catch (err) {
                  core.warning(`Failed to create milestone v1.0.0: ${err.message}`);
                }
              }
              if (milestone) {
                try {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    milestone: milestone.number
                  });
                  core.info(`Set milestone v1.0.0 (#${milestone.number}) on issue #${issue.number}`);
                } catch (err) {
                  core.warning(`Failed to set milestone on issue: ${err.message}`);
                }
              }
            }

            // 4) Status transition: needs-triage -> needs-review
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'needs-triage'
              });
            } catch (err) {
              if (err.status !== 404) {
                core.warning(`Failed to remove needs-triage label: ${err.message}`);
              }
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-review']
              });
            } catch (err) {
              core.warning(`Failed to add needs-review label: ${err.message}`);
            }

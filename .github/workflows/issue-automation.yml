name: Issue Management Automation

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read
  pull-requests: write

jobs:
  issue-triage:
    name: Triage Issue
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    outputs:
      category: ${{ steps.classify.outputs.category }}
      priority: ${{ steps.classify.outputs.priority }}
    steps:
      - name: Ensure required labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'bug',                    color: 'd73a4a', description: "Something isn't working" },
              { name: 'enhancement',            color: 'a2eeef', description: 'New feature or request' },
              { name: 'epic',                   color: '8a2be2', description: 'Large feature requiring multiple sub-tasks' },
              { name: 'maintenance',            color: 'fbca04', description: 'Maintenance and housekeeping tasks' },
              { name: 'priority-critical',      color: 'b60205', description: 'Critical priority issue' },
              { name: 'priority-high',          color: 'd93f0b', description: 'High priority issue' },
              { name: 'priority-medium',        color: 'fbca04', description: 'Medium priority issue' },
              { name: 'priority-low',           color: '0e8a16', description: 'Low priority issue' },
              { name: 'needs-triage',           color: 'ededed', description: 'Needs to be reviewed by maintainers' },
              { name: 'needs-review',           color: '5319e7', description: 'Awaiting review from maintainers' },
              { name: 'first-time-contributor', color: '7057ff', description: 'Issue created by first-time contributor' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
              } catch (err) {
                if (err.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                  core.info(`Created label: ${label.name}`);
                } else {
                  core.warning(`Failed to ensure label ${label.name}: ${err.message}`);
                }
              }
            }

      - name: Classify and label issue
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const text = `${title} ${body}`;

            const labelsToAdd = new Set(['needs-triage']);

            // Category labels (title-based)
            let category = '';
            if (title.includes('bug')) {
              labelsToAdd.add('bug');
              category = 'bug';
            }
            if (title.includes('epic')) {
              labelsToAdd.add('epic');
              category = 'epic';
            }
            if (title.includes('maintenance')) {
              labelsToAdd.add('maintenance');
              category = 'maintenance';
            }

            // Priority labels (title or body, highest wins)
            const priorityRules = [
              { label: 'priority-critical', keywords: ['critical', 'urgent', 'production', 'outage'] },
              { label: 'priority-high',     keywords: ['important', 'high', 'blocking'] },
              { label: 'priority-medium',   keywords: ['medium', 'normal'] },
              { label: 'priority-low',      keywords: ['low', 'nice-to-have', 'minor'] },
            ];
            let priority = 'priority-medium';
            for (const rule of priorityRules) {
              if (rule.keywords.some(k => text.includes(k))) {
                priority = rule.label;
                break;
              }
            }
            labelsToAdd.add(priority);

            core.info(`Adding labels: ${[...labelsToAdd].join(', ')}`);
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [...labelsToAdd],
              });
            } catch (err) {
              core.warning(`Failed to add labels: ${err.message}`);
            }

            core.setOutput('category', category);
            core.setOutput('priority', priority);

  task-breakdown:
    name: Epic Task Breakdown
    runs-on: ubuntu-latest
    needs: issue-triage
    if: github.event.action == 'opened' && contains(toJSON(github.event.issue.title), 'Epic')
    steps:
      - name: Create epic sub-issues and update parent
        uses: actions/github-script@v7
        with:
          script: |
            const parent = context.payload.issue;
            const parentNumber = parent.number;
            const parentTitle = parent.title;

            // Re-check title contains 'epic' (case-insensitive) defensively
            if (!/epic/i.test(parentTitle)) {
              core.info('Title does not contain Epic; skipping breakdown.');
              return;
            }

            const taskNames = [
              'Requirements Analysis',
              'Design and Architecture',
              'Implementation',
              'Testing and Documentation',
            ];

            const subIssueNumbers = [];
            for (let i = 0; i < taskNames.length; i++) {
              const taskNumber = i + 1;
              const taskName = taskNames[i];
              const subTitle = `[SUBTASK] ${parentTitle} - Task ${taskNumber}: ${taskName}`;
              const subBody = [
                `## Subtask: ${taskName}`,
                '',
                `Related to #${parentNumber}`,
                '',
                `This subtask is part of the epic **${parentTitle}**.`,
                '',
                '### Scope',
                `- Focus area: ${taskName}`,
                '',
                '### Definition of Done',
                '- [ ] Work completed',
                '- [ ] Reviewed by maintainers',
                '- [ ] Documentation updated',
              ].join('\n');

              try {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: subTitle,
                  body: subBody,
                  labels: ['enhancement', 'needs-review'],
                });
                subIssueNumbers.push(created.data.number);
                core.info(`Created sub-issue #${created.data.number}: ${subTitle}`);
              } catch (err) {
                core.warning(`Failed to create sub-issue ${taskNumber}: ${err.message}`);
              }
            }

            // Update parent body with checklist of sub-issues
            const checklistLines = subIssueNumbers.map((n, idx) => {
              return `- [ ] Task ${idx + 1}: ${taskNames[idx]} (#${n})`;
            });
            const epicSection = ['', '## Epic Tasks', '', ...checklistLines, ''].join('\n');
            const newBody = `${parent.body || ''}${epicSection}`;

            try {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parentNumber,
                body: newBody,
              });
              core.info(`Updated parent #${parentNumber} body with Epic Tasks checklist.`);
            } catch (err) {
              core.warning(`Failed to update parent issue body: ${err.message}`);
            }

  auto-response:
    name: Auto Response
    runs-on: ubuntu-latest
    needs: issue-triage
    if: github.event.action == 'opened'
    steps:
      - name: Respond to new issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const author = issue.user.login;
            const category = `${{ needs.issue-triage.outputs.category }}`;
            const priority = `${{ needs.issue-triage.outputs.priority }}`;

            // 1. First-time contributor check (this repo only)
            let isFirstInRepo = false;
            try {
              const result = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} type:issue author:${author}`,
                per_page: 5,
              });
              isFirstInRepo = (result.data.total_count <= 1);
            } catch (err) {
              core.warning(`Failed to check author history: ${err.message}`);
            }

            if (isFirstInRepo) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['first-time-contributor'],
                });
              } catch (err) {
                core.warning(`Failed to add first-time-contributor label: ${err.message}`);
              }
            }

            // 2. Build category-specific response
            let categorySection = '';
            if (category === 'bug') {
              categorySection = [
                '### Bug Report Guidelines',
                '',
                'Thank you for reporting a bug! To help us reproduce and fix the issue,',
                'please make sure your report contains:',
                '',
                '- A clear description of the bug',
                '- Steps to reproduce',
                '- Expected vs. actual behavior',
                '- Environment details (OS, Node.js version, browser, etc.)',
                '- Logs, screenshots, or stack traces when relevant',
                '',
                'A maintainer will review your report shortly.',
              ].join('\n');
            } else if (category === 'epic') {
              categorySection = [
                '### Feature Request Process',
                '',
                'Thanks for suggesting a new feature! Because this issue is an Epic,',
                'we have automatically broken it down into 4 sub-tasks:',
                '',
                '1. Requirements Analysis',
                '2. Design and Architecture',
                '3. Implementation',
                '4. Testing and Documentation',
                '',
                'Please review the generated sub-issues and add any extra acceptance',
                'criteria. A maintainer will follow up to schedule the work.',
              ].join('\n');
            } else if (category === 'maintenance') {
              categorySection = [
                '### Maintenance Guidelines',
                '',
                'Thanks for filing this maintenance task! Please make sure the issue',
                'describes:',
                '',
                '- The scope of the maintenance work',
                '- Why it is needed (tech debt, security, performance, etc.)',
                '- Affected files / modules',
                '- Risk and rollout considerations',
                '',
                'A maintainer will pick this up during the next maintenance cycle.',
              ].join('\n');
            } else {
              categorySection = [
                '### General Guidelines',
                '',
                'Thanks for opening an issue. A maintainer will review it shortly.',
              ].join('\n');
            }

            const welcome = isFirstInRepo
              ? `\n\n👋 Welcome, @${author}! Thanks for opening your **first issue** in this repository — we really appreciate your contribution.`
              : '';

            const commentBody = [
              `Hi @${author}, thanks for opening this issue! 🙌`,
              welcome,
              '',
              categorySection,
              '',
              `_Detected priority: \`${priority}\`_`,
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody,
              });
            } catch (err) {
              core.warning(`Failed to post auto-response comment: ${err.message}`);
            }

            // 3. Set milestone v1.0.0 for high/critical priority issues
            if (priority === 'priority-high' || priority === 'priority-critical') {
              try {
                const milestones = await github.rest.issues.listMilestones({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'all',
                  per_page: 100,
                });
                let milestone = milestones.data.find(m => m.title === 'v1.0.0');
                if (!milestone) {
                  const created = await github.rest.issues.createMilestone({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: 'v1.0.0',
                    description: 'Initial 1.0.0 release milestone',
                  });
                  milestone = created.data;
                  core.info(`Created milestone v1.0.0 (#${milestone.number}).`);
                }
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  milestone: milestone.number,
                });
              } catch (err) {
                core.warning(`Failed to set milestone v1.0.0: ${err.message}`);
              }
            }

            // 4. Swap needs-triage -> needs-review
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'needs-triage',
              });
            } catch (err) {
              if (err.status !== 404) {
                core.warning(`Failed to remove needs-triage: ${err.message}`);
              }
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['needs-review'],
              });
            } catch (err) {
              core.warning(`Failed to add needs-review label: ${err.message}`);
            }
